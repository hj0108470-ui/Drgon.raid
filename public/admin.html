<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 패널</title>
    <style>
        body { font-family: sans-serif; background: #1a202c; color: #fff; padding: 20px; }
        .card { background: #2d3748; padding: 15px; border-radius: 6px; margin-bottom: 10px; }
        button { background: #3182ce; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #4a5568; padding: 8px; text-align: center; }
        th { background: #4a5568; }
    </style>
</head>
<body>
    <h1>🛠️ 서버 관리자 패널</h1>
    <div class="card">
        <h3>접속 중인 플레이어 무기 지급 제어</h3>
        <table>
            <thead>
                <tr>
                    <th>닉네임</th>
                    <th>골드</th>
                    <th>명령</th>
                </tr>
            </thead>
            <tbody id="adminPlayerTable"></tbody>
        </table>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function giveWeaponPrompt(targetId) {
            const wKey = prompt("지급할 무기 키 입력 (예: shield_mythic, hidden_hong, staff_mythic):", "hidden_hong");
            if (wKey) {
                // 3. 어드민 무기 지급 요청 소켓 전송
                socket.emit('adminAction', {
                    action: 'giveSpecificWeapon',
                    payload: { targetId: targetId, weaponKey: wKey.trim() }
                });
                alert("무기 지급 요청이 전송되었습니다!");
            }
        }

        socket.on('updateState', (state) => {
            const tbody = document.getElementById('adminPlayerTable');
            tbody.innerHTML = '';
            Object.values(state.players).forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${p.name}</td>
                    <td>${p.gold.toLocaleString()} G</td>
                    <td><button onclick="giveWeaponPrompt('${p.id}')">무기 지급</button></td>
                `;
                tbody.appendChild(tr);
            });
        });
    </script>
</body>
</html>
