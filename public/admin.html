<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>👑 GM 관제 센터</title>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0b0c10; color: #66fcf1; padding: 15px; }
        .btn-gm { background: #45a29e; border: none; color: #fff; padding: 6px 10px; margin: 2px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; color: #fff; }
        th, td { border: 1px solid #45a29e; padding: 8px; text-align: center; font-size: 12px; }
    </style>
</head>
<body>
    <h2>👑 GM 관제 센터</h2>
    <div style="background:#1f2833; padding:12px; border-radius:8px;">
        <p>현재 보스: <strong id="bossStatus">-</strong></p>
        <button class="btn-gm" onclick="spawnBoss('pig')">🐷 꿀신 소환</button>
        <button class="btn-gm" onclick="spawnBoss('goliath')">🗿 골리앗 소환</button>
        <button class="btn-gm" onclick="spawnBoss('iraso')">🦖 이라소 소환</button>
        <button class="btn-gm" onclick="spawnBoss('dragon')">🐉 드래곤 소환</button>
        <button class="btn-gm" style="background:#c0392b;" onclick="killBoss()">💥 보스 즉사</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>닉네임</th>
                <th>HP</th>
                <th>골드</th>
                <th>누적 데미지 (랭킹)</th>
                <th>인벤</th>
                <th>GM 치트 / 조작</th>
            </tr>
        </thead>
        <tbody id="playerTable"></tbody>
    </table>
    <script>
        const socket = io({ transports: ['websocket', 'polling'] });
        socket.on('updateState', (state) => {
            if(!state || !state.boss) return;
            document.getElementById('bossStatus').innerText = state.boss.name + ' (' + state.boss.currentHp + '/' + state.boss.maxHp + ')';
            const tbody = document.getElementById('playerTable');
            tbody.innerHTML = '';
            Object.values(state.players).forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${p.name}</td>
                    <td>${p.hp}</td>
                    <td>${p.gold}G</td>
                    <td>${p.totalDamage || 0}</td>
                    <td>${p.inventory.length}/36</td>
                    <td>
                        <button class="btn-gm" onclick="giveGold('${p.id}')">+1만G</button>
                        <button class="btn-gm" onclick="giveMythic('${p.id}')">신화템</button>
                        <button class="btn-gm" style="background:#e67e22;" onclick="boostAtk('${p.id}')">공격력+500</button>
                        <button class="btn-gm" style="background:#8e44ad;" onclick="setRankScore('${p.id}')">랭킹조작</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        });
        function spawnBoss(type) { socket.emit('adminAction', { action: 'spawnBoss', payload: type }); }
        function killBoss() { socket.emit('adminAction', { action: 'killBoss' }); }
        function giveGold(id) { socket.emit('adminAction', { action: 'giveGold', payload: { targetId: id, amount: 10000 } }); }
        function giveMythic(id) { socket.emit('adminAction', { action: 'giveMythic', payload: { targetId: id } }); }
        function boostAtk(id) { socket.emit('adminAction', { action: 'boostAtk', payload: { targetId: id, amount: 500 } }); }
        function setRankScore(id) {
            const score = prompt('조작할 누적 데미지 점수를 입력하세요:', '999999');
            if (score !== null) {
                socket.emit('adminAction', { action: 'setRankScore', payload: { targetId: id, score: parseInt(score) || 0 } });
            }
        }
    </script>
</body>
</html>
