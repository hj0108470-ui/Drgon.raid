<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>어드민 모니터링 패널</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; text-align: center; }
        .admin-box { background: #222; padding: 20px; border-radius: 8px; max-width: 500px; margin: auto; }
        .inventory-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 15px; }
        .admin-inv-slot { background: #333; height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; border-radius: 4px; }
        .admin-inv-slot.filled { background: #2c3e50; border: 1px solid #3498db; }
        .admin-inv-slot.empty { color: #666; }
    </style>
</head>
<body>
    <div class="admin-box">
        <h2>🛠️ 어드민 인벤토리 모니터링</h2>
        <div id="admin-inventory-status">상태 로딩 중...</div>
        <div id="admin-inventory-slots" class="inventory-grid"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const MAX_SLOTS = 36;

        socket.on('updateState', (state) => {
            const players = Object.values(state.players);
            if (players.length === 0) {
                document.getElementById('admin-inventory-status').innerText = '접속 중인 플레이어가 없습니다.';
                return;
            }
            
            // 첫 번째 접속 유저의 인벤토리 상태 모니터링
            const targetPlayer = players[0]; 
            const inventory = targetPlayer.inventory || [];
            
            const container = document.getElementById('admin-inventory-slots');
            container.innerHTML = '';

            let emptyCount = 0;

            for (let i = 0; i < MAX_SLOTS; i++) {
                const slotDiv = document.createElement('div');
                const item = inventory[i];

                if (item) {
                    slotDiv.className = 'admin-inv-slot filled';
                    slotDiv.innerHTML = `<span>${item.icon}</span><span>${item.rarity}</span>`;
                } else {
                    slotDiv.className = 'admin-inv-slot empty';
                    slotDiv.innerHTML = `<span>${i + 1}</span>`;
                    emptyCount++;
                }
                container.appendChild(slotDiv);
            }

            // ✨ 인벤토리 오류 해결: 빈 슬롯 개수(emptyCount)를 기반으로 정확하게 가득 참 여부 판정
            const statusText = document.getElementById('admin-inventory-status');
            const usedSlots = MAX_SLOTS - emptyCount;
            const isReallyFull = usedSlots >= MAX_SLOTS;
            
            statusText.innerHTML = `사용 중인 칸: ${usedSlots} / ${MAX_SLOTS} | 빈 슬롯: ${emptyCount}개 <br>` +
                `상태: <span style="color: ${isReallyFull ? '#ff4d4d' : '#2ed573'}">${isReallyFull ? '인벤토리 가득 참' : '여유 있음'}</span>`;
        });
    </script>
</body>
</html>
