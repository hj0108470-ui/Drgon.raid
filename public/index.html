<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 레이드 RPG</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', sans-serif; }
        body { background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        /* 📱 세로형 핸드폰 맞춤 레이아웃 컨테이너 */
        #phone-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 844px;
            background: #1e1e1e;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 4px solid #333;
            border-radius: 0;
        }
        @media (min-width: 481px) {
            #phone-container { border-radius: 30px; height: 90vh; }
        }

        .screen { flex: 1; display: none; flex-direction: column; padding: 15px; overflow-y: auto; }
        .screen.active { display: flex; }

        /* 공통 UI 요소 */
        h2, h3, h4 { text-align: center; color: #ffcc00; margin-bottom: 10px; }
        input, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: none; font-size: 14px; }
        input { background: #2a2a2a; color: #fff; border: 1px solid #444; }
        button { background: #ffcc00; color: #121212; font-weight: bold; cursor: pointer; }
        button:active { opacity: 0.8; }

        /* 로그인 화면 */
        #login-screen { justify-content: center; align-items: center; }
        .auth-box { width: 100%; max-width: 300px; }

        /* 1. 전투 레이드 화면 */
        .status-bar { background: #2a2a2a; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; display: flex; justify-content: space-between; }
        .boss-section { text-align: center; background: #2a1a1a; border: 1px solid #ff4444; padding: 15px; border-radius: 10px; margin-bottom: 10px; }
        .hp-bar-bg { width: 100%; background: #444; height: 16px; border-radius: 8px; overflow: hidden; margin-top: 5px; }
        .hp-bar-fill { width: 100%; background: #ff4444; height: 100%; transition: width 0.2s; }
        .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .action-buttons button { margin-bottom: 0; padding: 15px; font-size: 16px; }

        /* 2. 🎒 창고(인벤토리) 화면 탭 (로비 공간) */
        .inventory-screen-container { flex: 1; display: flex; flex-direction: column; background: #181818; border-radius: 10px; padding: 10px; }
        .inventory-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; overflow-y: auto; flex: 1; padding: 5px; background: #121212; border-radius: 8px; border: 1px solid #333; }
        .inv-slot { aspect-ratio: 1; background: #252525; border: 1px solid #444; border-radius: 6px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 20px; cursor: pointer; position: relative; }
        .inv-slot.equipped { border-color: #00ffcc; background: #1a3a3a; }
        .inv-slot span { font-size: 9px; color: #aaa; margin-top: 2px; }

        /* 3. 🎰 뽑기 화면 탭 (로비 공간) */
        .gacha-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #181818; border-radius: 10px; padding: 20px; text-align: center; border: 1px solid #333; }
        .gacha-banner { font-size: 50px; margin-bottom: 15px; }

        /* 하단 네비게이션 탭바 */
        .nav-tabs { display: flex; background: #111; border-top: 1px solid #333; }
        .nav-tab { flex: 1; padding: 12px 0; text-align: center; font-size: 12px; color: #888; cursor: pointer; border: none; background: none; }
        .nav-tab.active { color: #ffcc00; font-weight: bold; border-top: 2px solid #ffcc00; }
    </style>
</head>
<body>

<div id="phone-container">
    <!-- 로그인/회원가입 화면 -->
    <div id="login-screen" class="screen active">
        <div class="auth-box">
            <h2>⚔️ 레이드 RPG</h2>
            <input type="text" id="nickname" placeholder="닉네임 입력">
            <input type="password" id="password" placeholder="비밀번호 입력">
            <button onclick="login()">로그인</button>
            <button onclick="register()" style="background:#444; color:#fff;">회원가입</button>
            <p id="auth-msg" style="text-align:center; color:#ff4444; font-size:12px; margin-top:10px;"></p>
        </div>
    </div>

    <!-- 1. 전투 레이드 화면 -->
    <div id="game-screen" class="screen">
        <div class="status-bar">
            <span id="user-info">닉네임 | 골드: 0G</span>
            <span id="user-hp">체력: 100/100</span>
        </div>

        <div class="boss-section">
            <h3 id="boss-name">보스 이름</h3>
            <div class="hp-bar-bg"><div id="boss-hp-fill" class="hp-bar-fill"></div></div>
            <p id="boss-hp-text" style="font-size: 12px; margin-top: 5px;">0 / 0</p>
        </div>

        <div class="action-buttons">
            <button onclick="attackBoss()" style="background: #ff4444; color:#fff;">⚔️ 공격하기</button>
            <button onclick="useSkill()" style="background: #ffaa00; color:#fff;">⚡ 스킬 사용</button>
        </div>
    </div>

    <!-- 2. 🎒 창고(인벤토리) 화면 탭 (로비) -->
    <div id="inventory-screen" class="screen">
        <h2>🎒 장비 창고 (36칸)</h2>
        <div class="inventory-screen-container">
            <div id="inventory-grid" class="inventory-grid"></div>
        </div>
    </div>

    <!-- 3. 🎰 장비 뽑기 화면 탭 (로비 - 전투 레이드가 아님) -->
    <div id="gacha-screen" class="screen">
        <h2>🎰 장비 뽑기 로비</h2>
        <div class="gacha-container">
            <div class="gacha-banner">🎁</div>
            <p style="color: #bbb; font-size: 13px; margin-bottom: 20px;">골드를 소모하여 강력한 장비를 획득하세요!</p>
            <button onclick="drawGacha()" style="background:#ffcc00; padding: 15px; font-size: 16px;">1,000 골드로 장비 뽑기</button>
        </div>
    </div>

    <!-- 4. 랭킹 화면 탭 -->
    <div id="ranking-screen" class="screen">
        <h2>🏆 전투력 랭킹</h2>
        <div id="ranking-list" style="font-size: 13px; color: #ccc;"></div>
    </div>

    <!-- 5. 길드 화면 탭 -->
    <div id="guild-screen" class="screen">
        <h2>🏰 길드 시스템</h2>
        <button onclick="createGuild()">길드 생성 (5000골드)</button>
    </div>

    <!-- 하단 네비게이션 바 (로비 전용 메뉴) -->
    <div class="nav-tabs" id="nav-bar" style="display:none;">
        <button class="nav-tab active" id="tab-btn-game" onclick="switchTab('game')">전투</button>
        <button class="nav-tab" id="tab-btn-inventory" onclick="switchTab('inventory')">창고</button>
        <button class="nav-tab" id="tab-btn-gacha" onclick="switchTab('gacha')">뽑기</button>
        <button class="nav-tab" id="tab-btn-ranking" onclick="switchTab('ranking')">랭킹</button>
        <button class="nav-tab" id="tab-btn-guild" onclick="switchTab('guild')">길드</button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let myPlayer = null;

    function login() {
        const nickname = document.getElementById('nickname').value;
        const password = document.getElementById('password').value;
        socket.emit('login', { nickname, password });
    }

    function register() {
        const nickname = document.getElementById('nickname').value;
        const password = document.getElementById('password').value;
        socket.emit('register', { nickname, password });
    }

    socket.on('authResult', (res) => {
        document.getElementById('auth-msg').innerText = res.message;
    });

    socket.on('loginSuccess', (res) => {
        if (res.success) {
            myPlayer = res.player;
            document.getElementById('login-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            document.getElementById('nav-bar').style.display = 'flex';
        }
    });

    function attackBoss() { socket.emit('attack'); }
    function useSkill() { socket.emit('useSkill'); }
    function drawGacha() { socket.emit('drawGacha'); }
    function createGuild() { 
        let gName = prompt("생성할 길드 이름을 입력하세요:");
        if (gName) socket.emit('createGuild', { guildName: gName, maxMembers: 5 });
    }

    function switchTab(tabName) {
        document.querySelectorAll('.screen').forEach(s => {
            if (s.id !== 'login-screen') s.classList.remove('active');
        });
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));

        document.getElementById(tabName + '-screen').classList.add('active');
        document.getElementById('tab-btn-' + tabName).classList.add('active');
    }

    socket.on('updateState', (state) => {
        if (!myPlayer) return;
        document.getElementById('boss-name').innerText = state.boss.name;
        const hpPercent = Math.max(0, (state.boss.currentHp / state.boss.maxHp) * 100);
        document.getElementById('boss-hp-fill').style.width = hpPercent + '%';
        document.getElementById('boss-hp-text').innerText = `${state.boss.currentHp.toLocaleString()} / ${state.boss.maxHp.toLocaleString()}`;

        const updatedMe = Object.values(state.players).find(p => p.name === myPlayer.name);
        if (updatedMe) {
            myPlayer = updatedMe;
            document.getElementById('user-info').innerText = `${myPlayer.name} | 💰 ${myPlayer.gold.toLocaleString()}G`;
            document.getElementById('user-hp').innerText = `❤️ ${myPlayer.hp}/${myPlayer.maxHp}`;
            renderInventory();
        }
    });

    function renderInventory() {
        const grid = document.getElementById('inventory-grid');
        grid.innerHTML = '';
        for (let i = 0; i < 36; i++) {
            const slot = document.createElement('div');
            slot.className = 'inv-slot';
            const item = myPlayer.inventory[i];
            if (item) {
                if (myPlayer.equippedIndex === i) slot.classList.add('equipped');
                slot.innerHTML = `${item.icon || '📦'}<span>+${item.enhance || 0}</span>`;
                slot.onclick = () => socket.emit('equipItem', i);
            }
            grid.appendChild(slot);
        }
    }
</script>
</body>
</html>
