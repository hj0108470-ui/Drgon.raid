<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>👑 실시간 멀티플레이어 보스 레이드</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; display: flex; gap: 20px; }
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        button { background: #ff9800; color: #000; font-weight: bold; cursor: pointer; border: none; padding: 10px 15px; border-radius: 4px; margin: 5px 0; }
        button:hover { background: #ffa726; }
        input, select { background: #2c2c2c; color: #fff; border: 1px solid #555; padding: 8px; border-radius: 4px; margin: 5px 0; }
        .screen { display: none; }
        .active-screen { display: block; }
        .inventory-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 10px; }
        .slot { background: #2c2c2c; border: 1px solid #444; min-height: 50px; border-radius: 4px; padding: 5px; text-align: center; font-size: 12px; cursor: pointer; position: relative; }
        .slot.equipped { border: 2px solid #ffeb3b; }
    </style>
</head>
<body>

<div class="container" style="flex-direction: column;">
    
    <!-- 1. 로그인/회원가입 화면 -->
    <div id="authScreen" class="screen active-screen card" style="max-width: 400px; margin: 100px auto; text-align: center;">
        <h2>🔐 레이드 로그인</h2>
        <input type="text" id="username" placeholder="닉네임"><br>
        <input type="password" id="password" placeholder="비밀번호"><br>
        <button onclick="login()">로그인</button>
        <button onclick="register()">회원가입</button>
        <p id="authMsg" style="color: #ff5252;"></p>
    </div>

    <!-- 2. 로비 화면 (LOBBY) -->
    <div id="lobbyScreen" class="screen card">
        <h1>LOBBY</h1>
        <div style="display: flex; gap: 20px;">
            <div style="flex: 1; background: #252525; padding: 20px; border-radius: 6px;">
                <h3>👤 나의 정보</h3>
                <p>이름: <b id="lobbyName">-</b></p>
                <p>골드: <b id="lobbyGold">0</b> G</p>
                <p>아이템 개수: <b id="lobbyInvenCount">0</b> / 36개</p>
                <p>랭킹 순위: <b id="lobbyRank">-</b>위</p>
                <br>
                <button onclick="goToBattle()" style="background: #4caf50; color: white; width: 100%; padding: 15px; font-size: 16px;">⚔️ 전투하러 가기</button>
            </div>
            
            <div style="flex: 1; background: #252525; padding: 20px; border-radius: 6px;">
                <h3>🏰 길드 시스템</h3>
                <div id="guildInfoBox">
                    <p>현재 소속된 길드가 없습니다.</p>
                    <input type="text" id="newGuildName" placeholder="길드 이름"><br>
                    <label>최대 인원:</label>
                    <input type="number" id="guildMaxMembers" value="5" min="2" max="20" style="width: 60px;"><br>
                    <button onclick="createGuild()">길드 창설</button>
                </div>
                <div id="guildListContainer" style="margin-top: 15px; max-height: 150px; overflow-y: auto;">
                    <!-- 길드 목록 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 3. 전투 및 인벤토리 화면 -->
    <div id="battleScreen" class="screen card">
        <button onclick="backToLobby()" style="background: #607d8b; color: white;">🏠 로비로 돌아가기</button>
        <h2>🐉 보스 레이드 전시장</h2>
        
        <div style="display: flex; gap: 20px;">
            <div style="flex: 1; background: #252525; padding: 20px; border-radius: 6px; text-align: center;">
                <h3 id="bossName">보스 이름</h3>
                <p>체력: <span id="bossHp">0</span> / <span id="bossMaxHp">0</span></p>
                <progress id="bossHpBar" value="0" max="100" style="width: 100%; height: 25px;"></progress>
                <br><br>
                <button onclick="attackBoss()" style="padding: 15px 30px; font-size: 18px; background: #e91e63; color: white;">⚔️ 일반 공격</button>
                <button id="skillBtn" onclick="useSkill()" style="padding: 15px 30px; font-size: 18px; background: #9c27b0; color: white;">⚡ 스킬 사용</button>
                <p>내 체력: <span id="playerHp">100</span> / <span id="playerMaxHp">100</span></p>
            </div>

            <div style="flex: 1; background: #252525; padding: 20px; border-radius: 6px;">
                <h3>🎒 인벤토리 (최대 36칸)</h3>
                <div id="inventoryGrid" class="inventory-grid"></div>
                <div style="margin-top: 15px;">
                    <button onclick="drawGacha()" style="background: #ff5722; color: white;">🎲 무기 가챠 (1,000 G)</button>
                    <input type="text" id="couponInput" placeholder="쿠폰 입력">
                    <button onclick="useCoupon()">쿠폰 사용</button>
                </div>
            </div>
        </div>

        <!-- 랭킹 영역 -->
        <div class="card" style="margin-top: 20px;">
            <h3>🏆 랭킹보드</h3>
            <div style="display: flex; gap: 20px;">
                <div style="flex: 1;">
                    <h4>👤 플레이어 데미지 랭킹</h4>
                    <ul id="playerRankList" style="padding-left: 20px;"></ul>
                </div>
                <div style="flex: 1;">
                    <h4>🏰 길드 랭킹</h4>
                    <ul id="guildRankList" style="padding-left: 20px;"></ul>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let myData = null;

    function register() {
        const nickname = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        socket.emit('register', { nickname, password });
    }

    function login() {
        const nickname = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        socket.emit('login', { nickname, password });
    }

    socket.on('authResult', (res) => {
        document.getElementById('authMsg').innerText = res.message;
    });

    socket.on('loginSuccess', (data) => {
        myData = data.player;
        document.getElementById('authScreen').classList.remove('active-screen');
        document.getElementById('lobbyScreen').classList.add('active-screen');
        updateUI(data);
        socket.emit('getGuildList');
    });

    function goToBattle() {
        document.getElementById('lobbyScreen').classList.remove('active-screen');
        document.getElementById('battleScreen').classList.add('active-screen');
    }

    function backToLobby() {
        document.getElementById('battleScreen').classList.remove('active-screen');
        document.getElementById('lobbyScreen').classList.add('active-screen');
        socket.emit('getGuildList');
    }

    function attackBoss() { socket.emit('attack'); }
    function useSkill() { socket.emit('useSkill'); }
    function drawGacha() { socket.emit('drawGacha'); }
    
    function useCoupon() {
        const code = document.getElementById('couponInput').value;
        socket.emit('useCoupon', code);
    }

    function createGuild() {
        const name = document.getElementById('newGuildName').value;
        const maxMembers = document.getElementById('guildMaxMembers').value;
        socket.emit('createGuild', { guildName: name, maxMembers });
    }

    socket.on('guildResult', (res) => {
        alert(res.message);
        socket.emit('getGuildList');
    });

    socket.on('guildListResult', (guilds) => {
        const container = document.getElementById('guildListContainer');
        container.innerHTML = '<h4>🗺️ 길드 목록</h4>';
        if (guilds.length === 0) {
            container.innerHTML += '<p>생성된 길드가 없습니다.</p>';
            return;
        }
        guilds.forEach(g => {
            container.innerHTML += `<div><b>${g.name}</b> (${g.currentCount}/${g.maxMembers}명) <button onclick="socket.emit('joinGuild', '${g.id}')">가입</button></div>`;
        });
    });

    socket.on('skillResult', (res) => { alert(res.message); });
    socket.on('couponResult', (res) => { alert(res.message); });

    socket.on('updateState', (state) => {
        if (!myData) return;
        // 내 소켓 ID 플레이어 갱신
        const updatedMe = state.players[socket.id];
        if (updatedMe) myData = updatedMe;

        // 보스 정보 갱신
        document.getElementById('bossName').innerText = state.boss.name;
        document.getElementById('bossHp').innerText = state.boss.currentHp.toLocaleString();
        document.getElementById('bossMaxHp').innerText = state.boss.maxHp.toLocaleString();
        document.getElementById('bossHpBar').max = state.boss.maxHp;
        document.getElementById('bossHpBar').value = state.boss.currentHp;

        document.getElementById('playerHp').innerText = myData.hp;
        document.getElementById('playerMaxHp').innerText = myData.maxHp;

        // 로비 정보 갱신
        document.getElementById('lobbyName').innerText = myData.name;
        document.getElementById('lobbyGold').innerText = myData.gold.toLocaleString();
        document.getElementById('lobbyInvenCount').innerText = myData.inventory.length;

        // 인벤토리 렌더링
        const grid = document.getElementById('inventoryGrid');
        grid.innerHTML = '';
        for (let i = 0; i < 36; i++) {
            const slot = document.createElement('div');
            slot.className = 'slot';
            if (i < myData.inventory.length) {
                const item = myData.inventory[i];
                if (i === myData.equippedIndex) slot.classList.add('equipped');
                slot.innerHTML = `<div>${item.icon || '⚔️'}</div><small>${item.name}</small>`;
                slot.onclick = () => socket.emit('equipItem', i);
            }
            grid.appendChild(slot);
        }

        // 스킬 버튼 텍스트 변경
        const eq = myData.equippedIndex !== null ? myData.inventory[myData.equippedIndex] : null;
        const skillBtn = document.getElementById('skillBtn');
        if (!eq) skillBtn.innerText = '⚡ 일반 스킬';
        else if (eq.type === 'staff') skillBtn.innerText = '🌿 길드 힐 파동';
        else if (eq.type === 'buff') skillBtn.innerText = '🥁 길드 버프';
        else if (eq.type === 'shield') skillBtn.innerText = '🛡️ 절대 방벽';
        else skillBtn.innerText = '⚔️ 강타 스킬';
    });
</script>

</body>
</html>
