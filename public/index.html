<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 멀티 방치형 보스 레이드</title>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <style>
        body { 
            font-family: sans-serif; 
            margin: 0; 
            padding: 10px; 
            overflow-x: hidden;
            background: #0b0c10 url('1000016819_2.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 12, 16, 0.78);
            z-index: -1;
        }

        .container { max-width: 600px; margin: 0 auto; position: relative; z-index: 1; text-align: center; }
        
        .card { 
            background: rgba(22, 24, 32, 0.92); 
            backdrop-filter: blur(4px);
            border-radius: 12px; 
            padding: 15px; 
            margin-bottom: 12px; 
            border: 1px solid #3a3f52; 
            position: relative; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            text-align: left;
        }
        .boss-card { border: 2px solid #e74c3c; text-align: center; }
        
        @keyframes floatBoss {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        @keyframes hitEffect {
            0% { transform: translate(0, 0) scale(1); }
            20% { transform: translate(-6px, 3px) scale(0.95); filter: brightness(1.5); }
            40% { transform: translate(6px, -3px) scale(1.05); }
            60% { transform: translate(-4px, -2px) scale(0.98); }
            80% { transform: translate(4px, 2px) scale(1.02); }
            100% { transform: translate(0, 0) scale(1); filter: brightness(1); }
        }
        
        .boss-icon { 
            font-size: 75px; 
            margin: 5px 0; 
            display: inline-block; 
            animation: floatBoss 2.5s ease-in-out infinite;
        }
        .hit-anim { animation: hitEffect 0.3s ease !important; }

        .hp-bar-bg { background: #111; height: 24px; border-radius: 12px; overflow: hidden; margin: 10px 0; border: 1px solid #444; }
        .hp-bar-fill { background: linear-gradient(90deg, #c0392b, #e74c3c); height: 100%; width: 100%; transition: width 0.2s; }
        
        .action-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; margin-top: 10px; }
        .btn { background: #d35400; border: none; padding: 14px; color: #fff; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; box-shadow: 0 3px 6px rgba(0,0,0,0.3); transition: 0.1s; }
        .btn:active { transform: scale(0.97); }
        .btn-skill { background: #8e44ad; }
        .btn-gacha { background: #f1c40f; color: #000; }
        .btn-party { background: #2980b9; font-size: 13px; padding: 6px 12px; width: auto; }
        .btn-action { background: #27ae60; margin-top: 8px; font-size: 14px; padding: 10px; }

        .inventory-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-top: 10px; }
        .slot { background: #15171e; border: 1px solid #2f354a; height: 50px; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; position: relative; }
        .slot.equipped { border-color: #f1c40f; background: #3d3512; }
        .slot.selected { border-color: #3498db; background: #1b365d; box-shadow: 0 0 5px #3498db; }
        
        .ranking-list { text-align: left; font-size: 13px; max-height: 110px; overflow-y: auto; margin: 0; padding-left: 15px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #1e222d; padding: 20px; border-radius: 10px; width: 300px; border: 1px solid #555; text-align: center; }
        input { padding: 8px; border-radius: 4px; border: 1px solid #444; background: #111; color: #fff; width: 85%; margin-bottom: 10px; }
        
        .party-item-row { background: #2a2e3d; padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .popup-btn { background: #34495e; color: white; border: none; padding: 10px; margin: 4px 0; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .popup-btn:hover { background: #2c3e50; }
    </style>
</head>
<body>
    <!-- 🔐 로그인 및 회원가입 모달 -->
    <div id="authModal" class="modal" style="display: flex;">
        <div class="modal-content">
            <h3 style="color:#f1c40f; margin-top:0;">🔐 계정 로그인 / 회원가입</h3>
            <p style="font-size: 11px; color: #aaa;">닉네임과 비밀번호를 입력하여 시작하세요!</p>
            <input type="text" id="authNickInput" placeholder="닉네임 입력 (최대 12글자)" maxlength="12">
            <input type="password" id="authPwInput" placeholder="비밀번호 입력">
            <div style="display:flex; gap:5px;">
                <button class="btn" style="padding: 10px; background:#27ae60;" onclick="requestLogin()">로그인</button>
                <button class="btn" style="padding: 10px; background:#2980b9;" onclick="requestRegister()">회원가입</button>
            </div>
        </div>
    </div>

    <!-- 파티 참여 모달 -->
    <div id="partyListModal" class="modal">
        <div class="modal-content" style="width: 330px;">
            <h3 style="color:#3498db; margin-top:0;">🛡️ 파티 참여하기</h3>
            <p style="font-size: 12px; color: #aaa;">참여할 파티를 선택하세요 (최대 4인)</p>
            <div id="partyListContainer" style="max-height: 180px; overflow-y: auto; margin-bottom: 10px;"></div>
            <button class="btn" style="background:#555; padding: 8px;" onclick="closePartyModal()">닫기</button>
        </div>
    </div>

    <!-- 🎒 아이템 상호작용 팝업 모달 (단건/다중선택 분기) -->
    <div id="itemActionModal" class="modal">
        <div class="modal-content">
            <h3 id="popupTitle" style="color:#f1c40f; margin-top:0;">아이템 관리</h3>
            <div id="popupContentArea"></div>
            <button class="popup-btn" style="background:#7f8c8d; margin-top: 10px;" onclick="closeItemModal()">닫기</button>
        </div>
    </div>

    <div class="container">
        <!-- 보스 카드 -->
        <div class="card boss-card" id="bossCardArea">
            <div id="bossIcon" class="boss-icon">⚔️</div>
            <h2 id="bossName" style="margin: 5px 0;">🔄 서버 연결 중...</h2>
            <div class="hp-bar-bg"><div id="bossHpFill" class="hp-bar-fill"></div></div>
            <p id="bossHpText" style="margin: 0; font-weight: bold; font-size: 14px;">0 / 0</p>
            <div class="action-grid">
                <button class="btn" onclick="attack()">⚔️ 일반 공격</button>
                <button class="btn btn-skill" onclick="useSkill()">⚡ 스킬</button>
            </div>
        </div>

        <!-- 내 정보 -->
        <div class="card">
            <h3 style="margin-top:0; color:#3498db;">🛡️ 내 정보 & 파티</h3>
            <p style="margin: 6px 0;">닉네임: <strong id="myName" style="color:#f1c40f;">-</strong></p>
            <p style="margin: 6px 0;">💰 골드: <span id="myGold">500</span> G | ❤️ HP: <span id="myHp">100</span>/100</p>
            <div id="partyBox" style="margin-top: 8px; font-size: 13px; border-top: 1px dashed #444; padding-top: 8px; display: flex; justify-content: space-between; align-items: center;">
                <div>파티: <span id="partyStatus" style="color:#e74c3c;">미소속</span></div>
                <div id="partyButtonsArea"></div>
            </div>
        </div>

        <!-- 랭킹 & 뽑기 & 쿠폰 -->
        <div class="card" style="border: 2px solid #f1c40f;">
            <h3 style="margin: 0 0 8px 0; color: #f1c40f;">🏆 실시간 랭킹</h3>
            <ol id="rankingList" class="ranking-list"></ol>
        </div>

        <div class="card">
            <h3 style="margin-top:0;">🎰 무기 뽑기</h3>
            <button class="btn btn-gacha" onclick="gacha()">🎲 행운의 룰렛 뽑기 (1,000G)</button>
        </div>

        <div class="card">
            <h3 style="margin-top:0;">🎁 리딤 쿠폰 코드</h3>
            <div style="display: flex; gap: 5px; justify-content: center;">
                <input type="text" id="couponInput" placeholder="쿠폰 코드 입력" style="width: 70%; margin-bottom: 0;">
                <button class="btn" style="width: 25%; padding: 8px; font-size: 14px;" onclick="useCoupon()">등록</button>
            </div>
        </div>

        <!-- 무기고 -->
        <div class="card">
            <h3 style="margin-top:0; display:flex; justify-content:space-between; align-items:center;">
                <span>🎒 무기고 (36칸)</span>
                <span style="font-size:11px; color:#aaa;">슬롯 클릭: 다중선택</span>
            </h3>
            <div class="inventory-grid" id="inventoryGrid"></div>
            <button class="btn btn-action" onclick="openActionModal()">⚙️ 선택한 무기 관리 / 일괄 처리</button>
        </div>
    </div>

    <!-- 가방 가득 참 모달 -->
    <div id="fullModal" class="modal">
        <div class="modal-content">
            <h3 style="color:#e74c3c;">⚠️ 인벤토리 가득 참!</h3>
            <p id="dropItemText"></p>
            <button class="btn" onclick="closeModal()">확인</button>
        </div>
    </div>

    <script>
        const socket = io({ transports: ['websocket', 'polling'] });
        let myId = null;
        let currentPartyId = null;
        let selectedIndices = []; 
        let latestInventory = [];
        let equippedIndex = null;

        socket.on('connect', () => { myId = socket.id; });

        function requestRegister() {
            const nickname = document.getElementById('authNickInput').value.trim();
            const password = document.getElementById('authPwInput').value.trim();
            if (!nickname || !password) { alert('닉네임과 비밀번호를 모두 입력해주세요!'); return; }
            socket.emit('register', { nickname, password });
        }

        function requestLogin() {
            const nickname = document.getElementById('authNickInput').value.trim();
            const password = document.getElementById('authPwInput').value.trim();
            if (!nickname || !password) { alert('닉네임과 비밀번호를 모두 입력해주세요!'); return; }
            socket.emit('login', { nickname, password });
        }

        socket.on('authResult', (res) => { alert(res.message); });
        socket.on('loginSuccess', (res) => {
            if (res.success) {
                document.getElementById('authModal').style.display = 'none';
                alert('로그인 성공! 환영합니다.');
            }
        });

        function triggerHitEffect() {
            const bossIcon = document.getElementById('bossIcon');
            bossIcon.classList.remove('hit-anim');
            void bossIcon.offsetWidth; 
            bossIcon.classList.add('hit-anim');
        }

        function attack() { triggerHitEffect(); socket.emit('attack'); }
        function useSkill() { socket.emit('useSkill'); }
        function gacha() { socket.emit('drawGacha'); }
        function useCoupon() {
            const code = document.getElementById('couponInput').value.trim();
            if (code) socket.emit('useCoupon', code);
        }

        function promptCreateParty() {
            const partyName = prompt('생성할 파티 이름을 입력해주세요:', '초보 용사 파티');
            if (partyName) { socket.emit('createParty', partyName); }
        }

        function openPartyListModal() {
            socket.emit('getPartyList');
            document.getElementById('partyListModal').style.display = 'flex';
        }
        function closePartyModal() { document.getElementById('partyListModal').style.display = 'none'; }
        function joinSelectedParty(partyId) { socket.emit('joinParty', partyId); closePartyModal(); }
        function leaveParty() { socket.emit('leaveParty'); }
        socket.on('partyResult', (res) => { alert(res.message); });

        socket.on('partyListResult', (list) => {
            const container = document.getElementById('partyListContainer');
            container.innerHTML = '';
            if (list.length === 0) {
                container.innerHTML = '<p style="color:#aaa; font-size:13px;">현재 생성된 파티가 없습니다.</p>';
                return;
            }
            list.forEach(party => {
                const row = document.createElement('div');
                row.className = 'party-item-row';
                row.innerHTML = `
                    <div style="text-align:left; font-size:13px;">
                        <strong>${party.name}</strong> <span style="color:#3498db; font-size:11px;">(${party.count}/4인)</span>
                    </div>
                    <button class="btn" style="padding:4px 10px; font-size:12px; width:auto;" onclick="joinSelectedParty('${party.id}')">참여</button>
                `;
                container.appendChild(row);
            });
        });

        socket.on('skillResult', (res) => { 
            if (!res.success) { alert(res.message); } 
            else { triggerHitEffect(); alert(res.message); }
        });

        // ⚙️ 선택 개수에 따른 동적 팝업 제어
        function openActionModal() {
            if (selectedIndices.length === 0) {
                alert("관리할 무기를 슬롯에서 선택해주세요!");
                return;
            }

            const modal = document.getElementById('itemActionModal');
            const title = document.getElementById('popupTitle');
            const contentArea = document.getElementById('popupContentArea');
            contentArea.innerHTML = '';

            if (selectedIndices.length === 1) {
                // 단건 클릭: 강화, 판매, 삭제, 장착/해제 메뉴 제공
                const idx = selectedIndices[0];
                const item = latestInventory[idx];
                if (!item) { alert("비어있는 슬롯입니다."); selectedIndices = []; return; }

                title.innerText = `🔍 단건 무기 관리: ${item.name} (+${item.enhance || 0})`;
                const isEquipped = (equippedIndex === idx);
                const equipText = isEquipped ? '장착 해제' : '무기 장착';
                const enhanceCost = ((item.enhance || 0) + 1) * 400;

                contentArea.innerHTML = `
                    <button class="popup-btn" style="background:#2980b9;" onclick="doSingleAction('equip', ${idx})">${equipText}</button>
                    <button class="popup-btn" style="background:#f39c12;" onclick="doSingleAction('enhance', ${idx})">✨ 강화 (${enhanceCost}G)</button>
                    <button class="popup-btn" style="background:#e67e22;" onclick="doSingleAction('sell', ${idx})">💰 단건 판매 (${item.sellPrice}G)</button>
                    <button class="popup-btn" style="background:#c0392b;" onclick="doSingleAction('delete', ${idx})">🗑️ 단건 삭제</button>
                `;
            } else {
                // 다중 클릭: 판매, 삭제 메뉴 제공
                title.innerText = `📦 다중 선택 무기 관리 (${selectedIndices.length개})`;
                contentArea.innerHTML = `
                    <button class="popup-btn" style="background:#e67e22;" onclick="doBatchAction('sell')">💰 선택 무기 일괄 판매</button>
                    <button class="popup-btn" style="background:#c0392b;" onclick="doBatchAction('delete')">🗑️ 선택 무기 일괄 삭제</button>
                `;
            }

            modal.style.display = 'flex';
        }

        function closeItemModal() {
            document.getElementById('itemActionModal').style.display = 'none';
        }

        function doSingleAction(actionType, idx) {
            closeItemModal();
            if (actionType === 'equip') socket.emit('equipItem', idx);
            if (actionType === 'enhance') socket.emit('enhanceItem', idx);
            if (actionType === 'sell') socket.emit('sellItems', [idx]);
            if (actionType === 'delete') socket.emit('deleteItems', [idx]);
            selectedIndices = [];
        }

        function doBatchAction(actionType) {
            closeItemModal();
            if (actionType === 'sell') socket.emit('sellItems', selectedIndices);
            if (actionType === 'delete') socket.emit('deleteItems', selectedIndices);
            selectedIndices = [];
        }

        socket.on('sellResult', (res) => { alert(res.message); selectedIndices = []; });
        socket.on('deleteResult', (res) => { alert(res.message); selectedIndices = []; });
        socket.on('enhanceResult', (res) => { alert(res.message); });

        socket.on('updateState', (state) => {
            if (!state || !state.boss) return;

            const bossParts = state.boss.name.split(' ');
            if (bossParts.length >= 2) {
                document.getElementById('bossIcon').innerText = bossParts[0];
                document.getElementById('bossName').innerText = bossParts.slice(1).join(' ');
            } else {
                document.getElementById('bossIcon').innerText = '👾';
                document.getElementById('bossName').innerText = state.boss.name;
            }

            const bossHpPct = (state.boss.currentHp / state.boss.maxHp) * 100;
            document.getElementById('bossHpFill').style.width = Math.max(0, bossHpPct) + '%';
            document.getElementById('bossHpText').innerText = Math.max(0, state.boss.currentHp) + ' / ' + state.boss.maxHp;
            
            const rankingList = document.getElementById('rankingList');
            rankingList.innerHTML = '';
            const sortedPlayers = Object.values(state.players).sort((a, b) => (b.totalDamage || 0) - (a.totalDamage || 0));
            sortedPlayers.slice(0, 5).forEach((p) => {
                const li = document.createElement('li');
                const isMe = p.id === myId ? ' (나)' : '';
                li.innerText = `${p.name}${isMe} - ${p.totalDamage || 0} 데미지`;
                rankingList.appendChild(li);
            });

            const me = state.players[myId];
            if (me) {
                document.getElementById('myName').innerText = me.name;
                document.getElementById('myHp').innerText = me.hp;
                document.getElementById('myGold').innerText = me.gold;
                
                latestInventory = me.inventory || [];
                equippedIndex = me.equippedIndex;

                currentPartyId = me.partyId;
                const partyStatus = document.getElementById('partyStatus');
                const partyButtonsArea = document.getElementById('partyButtonsArea');
                
                if (currentPartyId && state.parties[currentPartyId]) {
                    const pInfo = state.parties[currentPartyId];
                    partyStatus.innerText = `[${pInfo.name}] (${pInfo.members.length}/4인)`;
                    partyStatus.style.color = '#2ecc71';
                    partyButtonsArea.innerHTML = `<button class="btn btn-party" style="background:#e74c3c;" onclick="leaveParty()">파티 탈퇴</button>`;
                } else {
                    partyStatus.innerText = '미소속';
                    partyStatus.style.color = '#e74c3c';
                    partyButtonsArea.innerHTML = `
                        <button class="btn btn-party" onclick="promptCreateParty()">파티 만들기</button>
                        <button class="btn btn-party" style="background:#27ae60; margin-left:4px;" onclick="openPartyListModal()">파티 참여</button>
                    `;
                }

                const grid = document.getElementById('inventoryGrid');
                grid.innerHTML = '';
                for (let i = 0; i < 36; i++) {
                    const slot = document.createElement('div');
                    slot.className = 'slot';
                    const item = me.inventory[i];
                    
                    if (item) {
                        if (me.equippedIndex === i) slot.classList.add('equipped');
                        if (selectedIndices.includes(i)) slot.classList.add('selected');

                        slot.innerHTML = '<div>' + item.icon + '</div><div>+' + (item.enhance||0) + '</div>';
                        
                        // 슬롯 클릭: 다중 선택 토글
                        slot.onclick = () => {
                            const idxPos = selectedIndices.indexOf(i);
                            if (idxPos > -1) {
                                selectedIndices.splice(idxPos, 1);
                                slot.classList.remove('selected');
                            } else {
                                selectedIndices.push(i);
                                slot.classList.add('selected');
                            }
                        };
                    } else { 
                        slot.innerText = '빈칸'; 
                    }
                    grid.appendChild(slot);
                }
            }
        });

        socket.on('couponResult', (res) => alert(res.message));
        socket.on('gachaResult', (res) => {
            if (!res.success) alert(res.message);
            else alert('🎉 획득: ' + res.weapon.icon + ' [' + res.weapon.rarity + '] ' + res.weapon.name);
        });
        socket.on('itemObtained', (data) => {
            if (data.full) {
                document.getElementById('dropItemText').innerText = '가방 포화로 드랍 실패: ' + data.weapon.name;
                document.getElementById('fullModal').style.display = 'flex';
            } else { alert('👑 보상 획득: ' + data.weapon.name); }
        });
        
        function closeModal() { document.getElementById('fullModal').style.display = 'none'; }
    </script>
</body>
</html>
