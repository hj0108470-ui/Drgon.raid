<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>실시간 보스 레이드 & 거래소</title>
    <style>
        /* 기존 레이아웃 및 크기/위치 절대 유지 */
        body { font-family: 'Malgun Gothic', sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 1000px; display: flex; gap: 20px; }
        .panel { background: #1e1e1e; border: 2px solid #333; border-radius: 8px; padding: 15px; box-sizing: border-box; }
        
        /* 기존 버튼 및 모달 스타일 */
        button { background: #ff4757; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #ff6b81; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #222; padding: 20px; border-radius: 8px; width: 400px; border: 2px solid #555; text-align: center; }
        
        /* 거래소 추가 스타일 (크기 변동 없음) */
        .market-item-box { background: #2a2a2a; border: 1px solid #444; padding: 8px; margin-bottom: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    </style>
</head>
<body>

    <h2>⚔️ 실시간 보스 레이드 및 통합 거래소</h2>
    <div id="auth-section">
        <input type="text" id="nickname" placeholder="닉네임">
        <input type="password" id="password" placeholder="비밀번호">
        <button onclick="login()">로그인</button>
        <button onclick="register()">회원가입</button>
    </div>

    <div id="game-section" style="display:none; width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="container">
            <!-- 보스 및 정보 패널 -->
            <div class="panel" style="width: 480px;">
                <h3 id="boss-name">보스 이름</h3>
                <progress id="boss-hp-bar" value="100" max="100" style="width: 100%; height: 25px;"></progress>
                <p id="boss-hp-text">HP: 0 / 0</p>
                <button onclick="attackBoss()" style="width: 100%; padding: 12px; font-size: 16px;">⚔️반격 공격</button>
                <button onclick="useSkill()" style="width: 100%; margin-top: 8px; background: #2ed573;">✨스킬 사용</button>
                <div style="margin-top: 15px;">
                    <button onclick="openMarketModal()">🛒 실시간 거래소 열기</button>
                </div>
            </div>

            <!-- 플레이어 정보 및 인벤토리 -->
            <div class="panel" style="width: 500px;">
                <h3>내 정보 (<span id="p-name"></span>)</h3>
                <p>골드: <span id="p-gold">0</span> G | 체력: <span id="p-hp">100</span>/<span id="p-maxhp">100</span></p>
                <h4>인벤토리 (최대 36칸)</h4>
                <div id="inventory-grid" style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; height: 220px; overflow-y: auto; background: #111; padding: 5px; border-radius: 4px;"></div>
            </div>
        </div>
    </div>

    <!-- 실시간 거래소 모달창 -->
    <div id="market-modal" class="modal">
        <div class="modal-content" style="width: 500px; max-height: 80vh; overflow-y: auto;">
            <h3>🛒 실시간 플레이어 거래소</h3>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <button onclick="openRegisterMarketView()" style="flex: 1; background: #1e90ff;">내 아이템 등록하기</button>
                <button onclick="closeMarketModal()" style="background: #555; width: 80px;">닫기</button>
            </div>
            <div id="market-listings-container" style="text-align: left; max-height: 350px; overflow-y: auto;">
                <!-- 등록된 매물 리스트 표시 영역 -->
            </div>
        </div>
    </div>

    <!-- 매물 등록 서브 모달 -->
    <div id="market-register-modal" class="modal">
        <div class="modal-content" style="width: 400px;">
            <h3>📦 거래소 매물 올리기</h3>
            <p id="selected-market-item-name" style="color: #ff4757; font-weight: bold;">등록할 아이템을 선택하세요</p>
            <div style="text-align: left; margin: 10px 0;">
                <label>판매 가격 (골드):</label><br>
                <input type="number" id="market-price-input" value="0" style="width: 100%; padding: 5px; box-sizing: border-box; margin-top: 5px;"><br><br>
                <label>원하는 교환 아이템 종류 (물물교환용):</label><br>
                <select id="market-desired-type" style="width: 100%; padding: 5px; margin-top: 5px;">
                    <option value="none">상관없음 (골드로만 판매)</option>
                    <option value="knife">단검류</option>
                    <option value="shield">방패류</option>
                    <option value="bow">활류</option>
                    <option value="staff">지팡이류</option>
                    <option value="artifact">유물류</option>
                </select><br><br>
                <label>원하는 아이템 등급:</label><br>
                <select id="market-desired-rarity" style="width: 100%; padding: 5px; margin-top: 5px;">
                    <option value="any">상관없음</option>
                    <option value="Common">Common</option>
                    <option value="Rare">Rare</option>
                    <option value="Epic">Epic</option>
                    <option value="Legendary">Legendary</option>
                    <option value="Mythic">Mythic</option>
                </select>
            </div>
            <div id="market-inventory-picker" style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; max-height: 150px; overflow-y: auto; background: #111; padding: 5px;"></div>
            <div style="margin-top: 15px;">
                <button onclick="confirmListMarketItem()" style="background: #2ed573;">등록 완료</button>
                <button onclick="closeRegisterMarketView()" style="background: #555;">취소</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myData = null;
        let selectedInventoryIdxForMarket = null;
        let currentMarketListings = {};

        function register() {
            const nickname = document.getElementById('nickname').value;
            const password = document.getElementById('password').value;
            socket.emit('register', { nickname, password });
        }

        function login() {
            const nickname = document.getElementById('nickname').value;
            const password = document.getElementById('password').value;
            socket.emit('login', { nickname, password });
        }

        socket.on('authResult', (res) => { alert(res.message); });
        socket.on('loginSuccess', (res) => {
            if(res.success) {
                myData = res.player;
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('game-section').style.display = 'flex';
            }
        });

        socket.on('updateState', (state) => {
            if (!myData) return;
            const updatedMe = state.players[socket.id];
            if (updatedMe) myData = updatedMe;

            // 보스 정보 갱신
            document.getElementById('boss-name').innerText = state.boss.name;
            document.getElementById('boss-hp-bar').max = state.boss.maxHp;
            document.getElementById('boss-hp-bar').value = state.boss.currentHp;
            document.getElementById('boss-hp-text').innerText = `HP: ${state.boss.currentHp.toLocaleString()} / ${state.boss.maxHp.toLocaleString()}`;

            // 플레이어 정보 갱신
            document.getElementById('p-name').innerText = myData.name;
            document.getElementById('p-gold').innerText = myData.gold.toLocaleString();
            document.getElementById('p-hp').innerText = myData.hp;
            document.getElementById('p-maxhp').innerText = myData.maxHp;

            renderInventory();
        });

        function renderInventory() {
            const grid = document.getElementById('inventory-grid');
            grid.innerHTML = '';
            for(let i=0; i<36; i++) {
                const item = myData.inventory[i];
                const cell = document.createElement('div');
                cell.style.cssText = "background: #222; border: 1px solid #444; height: 35px; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; position: relative;";
                if(item) {
                    cell.innerHTML = item.icon || '📦';
                    if(i === myData.equippedIndex) cell.style.border = "2px solid #2ed573";
                    cell.title = `${item.name} (${item.rarity})\n가격: ${item.sellPrice || 0}G`;
                    cell.onclick = () => socket.emit('equipItem', i);
                }
                grid.appendChild(cell);
            }
        }

        function attackBoss() { socket.emit('attack'); }
        function useSkill() { socket.emit('useSkill'); }

        // 거래소 모달 제어
        function openMarketModal() {
            document.getElementById('market-modal').style.display = 'flex';
            socket.emit('getMarketList');
        }
        function closeMarketModal() { document.getElementById('market-modal').style.display = 'none'; }

        socket.on('marketListResult', (listings) => {
            currentMarketListings = listings;
            const container = document.getElementById('market-listings-container');
            container.innerHTML = '';

            const keys = Object.keys(listings);
            if(keys.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #777;">등록된 거래소 매물이 없습니다.</p>';
                return;
            }

            keys.forEach(id => {
                const l = listings[id];
                const box = document.createElement('div');
                box.className = 'market-item-box';
                
                let tradeConditionText = l.priceGold > 0 ? `${l.priceGold.toLocaleString()} 골드` : '';
                if(l.desiredItemType !== 'none') {
                    tradeConditionText += ` 또는 [${l.desiredItemType} / ${l.desiredItemRarity}]`;
                }

                box.innerHTML = `
                    <div>
                        <b>${l.item.icon} ${l.item.name}</b> (${l.item.rarity})<br>
                        판매자: ${l.sellerName} | 가격/요청: <span style="color:#ffd700">${tradeConditionText}</span>
                    </div>
                    <div>
                        ${l.sellerId === socket.id ? 
                            `<button onclick="cancelMarketItem('${l.id}')" style="background:#e74c3c; padding: 4px 8px;">회수</button>` :
                            `<button onclick="buyMarketItemPrompt('${l.id}')" style="background:#2ed573; padding: 4px 8px;">구매/교환</button>`
                        }
                    </div>
                `;
                container.appendChild(box);
            });
        });

        function openRegisterMarketView() {
            document.getElementById('market-register-modal').style.display = 'flex';
            selectedInventoryIdxForMarket = null;
            document.getElementById('selected-market-item-name').innerText = "등록할 아이템을 선택하세요";
            
            const picker = document.getElementById('market-inventory-picker');
            picker.innerHTML = '';
            for(let i=0; i<36; i++) {
                const item = myData.inventory[i];
                const cell = document.createElement('div');
                cell.style.cssText = "background: #1e1e1e; border: 1px solid #444; height: 35px; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer;";
                if(item) {
                    cell.innerHTML = item.icon || '📦';
                    cell.onclick = () => {
                        selectedInventoryIdxForMarket = i;
                        document.getElementById('selected-market-item-name').innerText = `선택됨: ${item.name}`;
                    };
                }
                picker.appendChild(cell);
            }
        }

        function closeRegisterMarketView() { document.getElementById('market-register-modal').style.display = 'none'; }

        function confirmListMarketItem() {
            if(selectedInventoryIdxForMarket === null) {
                alert('등록할 아이템을 선택해주세요.');
                return;
            }
            const priceGold = document.getElementById('market-price-input').value;
            const desiredItemType = document.getElementById('market-desired-type').value;
            const desiredItemRarity = document.getElementById('market-desired-rarity').value;

            socket.emit('listMarketItem', {
                inventoryIndex: selectedInventoryIdxForMarket,
                priceGold,
                desiredItemType,
                desiredItemRarity
            });
            closeRegisterMarketView();
        }

        function cancelMarketItem(listingId) {
            socket.emit('cancelMarketItem', listingId);
        }

        function buyMarketItemPrompt(listingId) {
            const l = currentMarketListings[listingId];
            if(!l) return;

            let choice = confirm(`[${l.item.name}] 매물을 구매하시겠습니까?\n\n1. 확인: 골드로 구매 (${l.priceGold.toLocaleString()} G)\n2. 취소: 인벤토리 아이템으로 물물교환하기`);
            
            if(choice) {
                socket.emit('buyMarketItem', { listingId, payWithGold: true });
            } else {
                // 물물교환용 인벤토리 아이템 선택 프롬프트창 표시
                let invIdxStr = prompt("지불할 내 인벤토리 슬롯 번호(0~35)를 입력하세요 (장착 해제 상태여야 합니다):");
                if(invIdxStr !== null) {
                    let invIdx = parseInt(invIdxStr);
                    if(!isNaN(invIdx)) {
                        socket.emit('buyMarketItem', { listingId, payWithGold: false, payWithInventoryIndex: invIdx });
                    }
                }
            }
        }

        socket.on('marketResult', (res) => { alert(res.message); socket.emit('getMarketList'); });
    </script>
</body>
</html>
