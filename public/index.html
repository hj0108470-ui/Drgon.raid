<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>보스 레이드 & 장비 강화 RPG</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 900px; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .hidden { display: none !important; }
        button { background: #333; color: #fff; border: 1px solid #555; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #444; border-color: #777; }
        input, select { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 6px; }
        .box { background: #252525; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .flex { display: flex; gap: 10px; align-items: center; }
        .space-between { justify-content: space-between; }
        
        /* 인벤토리 그리드 */
        .inventory-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 10px; }
        .slot { background: #2c2c2c; border: 2px dashed #444; aspect-ratio: 1; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; cursor: pointer; font-size: 12px; text-align: center; user-select: none; }
        .slot.equipped { border-color: #4CAF50; border-style: solid; }
        .slot:hover { border-color: #888; }
        .rarity-Common { color: #b0b0b0; }
        .rarity-Rare { color: #4CAF50; }
        .rarity-Epic { color: #9C27B0; }
        .rarity-Legendary { color: #FF9800; }
        .rarity-Mythic { color: #E91E63; }

        /* HP 바 */
        .hp-bar-container { width: 100%; background: #333; border-radius: 10px; height: 22px; overflow: hidden; position: relative; margin: 10px 0; }
        .hp-bar { height: 100%; background: #d32f2f; width: 100%; transition: width 0.3s; }
        .hp-text { position: absolute; width: 100%; text-align: center; top: 2px; font-weight: bold; font-size: 12px; text-shadow: 1px 1px 2px #000; }

        /* 아이템 상세 정보 모달 */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: #252525; border: 1px solid #444; padding: 20px; border-radius: 10px; width: 300px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.7); }
    </style>
</head>
<body>

<div class="container">
    <!-- 🔐 인증 화면 -->
    <div id="auth-screen">
        <h2>⚔️ 보스 레이드 & 장비 강화 RPG</h2>
        <div class="box">
            <h3>로그인 / 회원가입</h3>
            <div class="flex" style="flex-direction: column; align-items: stretch; gap: 8px; max-width: 300px;">
                <input type="text" id="username" placeholder="닉네임">
                <input type="password" id="password" placeholder="비밀번호">
                <div class="flex">
                    <button onclick="login()" style="flex:1; background: #2196F3;">로그인</button>
                    <button onclick="register()" style="flex:1; background: #4CAF50;">회원가입</button>
                </div>
            </div>
            <p id="auth-msg" style="color: #ff5252; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- 🎮 게임 메인 화면 -->
    <div id="game-screen" class="hidden">
        <div class="flex space-between box">
            <div>
                <h2 id="player-info" style="margin: 0 0 5px 0;">플레이어 명</h2>
                <div id="player-status-text" style="font-size: 13px; color: #aaa;">골드: 500 G | 체력: 100/100 | EXP: 0/100 (0%)</div>
            </div>
            <button onclick="logout()" style="background: #f44336;">로그아웃</button>
        </div>

        <!-- 🐉 보스 전투 구역 -->
        <div class="box" style="text-align: center; background: #222;">
            <h2 id="boss-name" style="margin: 5px 0;">보스 이름</h2>
            <div class="hp-bar-container">
                <div id="boss-hp-bar" class="hp-bar"></div>
                <div id="boss-hp-text" class="hp-text">0 / 0</div>
            </div>
            <div class="flex" style="justify-content: center; gap: 10px; margin-top: 15px;">
                <button onclick="attackBoss()" style="padding: 12px 24px; font-size: 16px; background: #ff9800; color: #000;">⚔️ 공격하기</button>
                <button onclick="useSkill()" style="padding: 12px 24px; font-size: 16px; background: #9c27b0;">✨ 스킬 사용</button>
                <button onclick="drawGacha()" style="padding: 12px 24px; font-size: 16px; background: #00bcd4; color: #000;">🎁 무기 뽑기 (1000G)</button>
            </div>
        </div>

        <!-- 🎒 인벤토리 및 장비 관리 -->
        <div class="box">
            <div class="flex space-between">
                <h3 style="margin:0;">🎒 인벤토리 (클릭 선택 / 꾹 누르면 상세정보)</h3>
                <div class="flex">
                    <button onclick="enhanceSelected()" style="background: #e91e63;">✨ 강화</button>
                    <button onclick="equipSelected()" style="background: #4caf50;">🛡️ 장착/해제</button>
                    <button onclick="sellSelected()" style="background: #ff9800; color:#000;">💰 판매</button>
                    <button onclick="deleteSelected()" style="background: #f44336;">🗑️ 삭제</button>
                </div>
            </div>
            <div id="inventory-grid" class="inventory-grid"></div>
        </div>

        <!-- 🏆 랭킹 및 기타 콘텐츠 -->
        <div class="flex" style="align-items: flex-start; gap: 15px;">
            <div class="box" style="flex: 1;">
                <h3 style="margin-top:0;">🏆 데미지 랭킹</h3>
                <ul id="ranking-list" style="padding-left: 20px; font-size: 14px; margin: 0;"></ul>
            </div>
            <div class="box" style="flex: 1;">
                <h3 style="margin-top:0;">🎟️ 쿠폰 입력</h3>
                <div class="flex">
                    <input type="text" id="coupon-code" placeholder="쿠폰 코드 입력 (예: WELCOME2026)" style="flex:1;">
                    <button onclick="useCoupon()" style="background: #673AB7;">사용</button>
                </div>
                <p id="coupon-msg" style="font-size: 12px; margin: 5px 0 0 0; color: #4CAF50;"></p>
            </div>
        </div>
    </div>
</div>

<!-- 📋 아이템 상세 정보 팝업 모달 -->
<div id="item-modal" class="modal hidden">
    <div class="modal-content">
        <h3 id="modal-item-name" style="margin-top: 0;">아이템 이름</h3>
        <p id="modal-item-rarity" style="font-weight: bold; margin: 5px 0;">등급</p>
        <p id="modal-item-detail" style="font-size: 14px; color: #ccc; margin: 10px 0;">상세 스펙</p>
        <button onclick="closeModal()" style="background: #555; margin-top: 10px; width: 100%;">닫기</button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let myPlayer = null;
    let selectedSlotIndex = null;
    let pressTimer = null;

    function register() {
        const nickname = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        socket.emit('register', { nickname, password });
    }

    function login() {
        const nickname = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        socket.emit('login', { nickname, password });
    }

    socket.on('authResult', (res) => {
        document.getElementById('auth-msg').innerText = res.message;
        if(res.success) {
            document.getElementById('auth-msg').style.color = '#4CAF50';
        }
    });

    socket.on('loginSuccess', (res) => {
        myPlayer = res.player;
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        socket.emit('setGameActive', true);
    });

    function logout() {
        socket.emit('setGameActive', false);
        location.reload();
    }

    function attackBoss() {
        socket.emit('attack');
    }

    function useSkill() {
        socket.emit('useSkill');
    }

    socket.on('skillResult', (res) => {
        alert(res.message);
    });

    function drawGacha() {
        socket.emit('drawGacha');
    }

    socket.on('gachaResult', (res) => {
        if(res.success) {
            alert(`🎉 [${res.weapon.name}] 획득!`);
        }
    });

    function selectSlot(idx) {
        selectedSlotIndex = idx;
        renderInventory();
    }

    function showItemInfo(item) {
        if(!item) return;
        const nameEl = document.getElementById('modal-item-name');
        const rarityEl = document.getElementById('modal-item-rarity');
        const detailEl = document.getElementById('modal-item-detail');

        let enhanceStr = item.enhance ? ` (+${item.enhance})` : '';
        nameEl.innerText = `${item.icon || '📦'} ${item.name}${enhanceStr}`;
        rarityEl.innerText = `[${item.rarity}]`;
        rarityEl.className = `rarity-${item.rarity}`;

        let detailText = `기본 공격력: ${item.atk}<br>`;
        if(item.enhance > 0) detailText += `강화 보너스: +${item.enhance * 5} (총 ${item.atk + item.enhance * 5})<br>`;
        detailText += `상점 판매가: ${item.sellPrice + ((item.enhance || 0) * 100)} G`;
        detailEl.innerHTML = detailText;

        document.getElementById('item-modal').classList.remove('hidden');
    }

    function closeModal() {
        document.getElementById('item-modal').classList.add('hidden');
    }

    function equipItem() {
        if(selectedSlotIndex !== null) socket.emit('equipItem', selectedSlotIndex);
    }
    function enhanceItem() {
        if(selectedSlotIndex !== null) socket.emit('enhanceItem', selectedSlotIndex);
    }
    function sellItem() {
        if(selectedSlotIndex !== null) socket.emit('sellItems', [selectedSlotIndex]);
    }
    function deleteItem() {
        if(selectedSlotIndex !== null) socket.emit('deleteItems', [selectedSlotIndex]);
    }

    function equipSelected() { equipItem(); }
    function enhanceSelected() { enhanceItem(); }
    function sellSelected() { sellItem(); }
    function deleteSelected() { deleteItem(); }

    function useCoupon() {
        const code = document.getElementById('coupon-code').value.trim();
        if(code) socket.emit('useCoupon', code);
    }
    socket.on('couponResult', (res) => {
        document.getElementById('coupon-msg').innerText = res.message;
    });

    socket.on('updateState', (state) => {
        if(myPlayer && state.players[socket.id]) {
            myPlayer = state.players[socket.id];
            document.getElementById('player-info').innerText = `${myPlayer.name} (LV. ${myPlayer.level || 1})`;
            
            let expPercent = Math.round((myPlayer.exp / myPlayer.maxExp) * 100);
            document.getElementById('player-status-text').innerText = 
                `골드: ${myPlayer.gold.toLocaleString()} G | 체력: ${myPlayer.hp}/${myPlayer.maxHp} | EXP: ${myPlayer.exp}/${myPlayer.maxExp} (${expPercent}%)`;
            
            renderInventory();
        }

        const boss = state.boss;
        document.getElementById('boss-name').innerText = boss.name;
        const hpPercent = Math.max(0, (boss.currentHp / boss.maxHp) * 100);
        document.getElementById('boss-hp-bar').style.width = hpPercent + '%';
        document.getElementById('boss-hp-text').innerText = `${boss.currentHp.toLocaleString()} / ${boss.maxHp.toLocaleString()} (${hpPercent.toFixed(1)}%)`;

        const rankList = document.getElementById('ranking-list');
        rankList.innerHTML = '';
        if(state.rankings && state.rankings.players) {
            state.rankings.players.slice(0, 5).forEach((p, idx) => {
                const li = document.createElement('li');
                li.innerText = `${idx+1}. ${p.name} (LV.${p.level}) - ${p.totalDamage.toLocaleString()} DMG`;
                rankList.appendChild(li);
            });
        }
    });

    function renderInventory() {
        const grid = document.getElementById('inventory-grid');
        grid.innerHTML = '';
        if(!myPlayer) return;

        for(let i=0; i<36; i++) {
            const slot = document.createElement('div');
            slot.className = 'slot';
            if(i === myPlayer.equippedIndex) slot.classList.add('equipped');
            if(i === selectedSlotIndex) slot.style.borderColor = '#2196F3';

            const item = myPlayer.inventory[i];
            if(item) {
                slot.classList.add(`rarity-${item.rarity}`);
                let enhanceStr = item.enhance ? ` +${item.enhance}` : '';
                slot.innerHTML = `<span style="font-size: 18px;">${item.icon || '📦'}</span><span style="font-size:10px;">${item.name}${enhanceStr}</span>`;

                // 꾹 누르기(Long Press) 이벤트 처리 (모바일 및 PC 호환)
                const startPress = (e) => {
                    e.preventDefault();
                    pressTimer = setTimeout(() => {
                        showItemInfo(item);
                    }, 500); // 0.5초 이상 꾹 누르면 작동
                };
                const cancelPress = () => {
                    clearTimeout(pressTimer);
                };

                slot.addEventListener('mousedown', startPress);
                slot.addEventListener('mouseup', cancelPress);
                slot.addEventListener('mouseleave', cancelPress);
                slot.addEventListener('touchstart', startPress);
                slot.addEventListener('touchend', cancelPress);
            }

            slot.onclick = () => selectSlot(i);
            grid.appendChild(slot);
        }
    }
</script>
</body>
</html>
